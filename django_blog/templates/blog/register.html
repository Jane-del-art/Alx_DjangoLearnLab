{% extends 'blog/base.html' %}
{% load static %}

{% block content %}
<h2>Register</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}
<p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
{% endblock %}
