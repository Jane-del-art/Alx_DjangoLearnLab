{% extends 'base.html' %}

{% block title %}Password Changed - Django Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Password Changed</h4>
            </div>
            <div class="card-body text-center">
                <div class="mb-4">
                    <i class="fas fa-check-circle fa-4x text-success"></i>
                </div>
                <h5>Your password has been changed successfully!</h5>
                <p class="text-muted">You can now use your new password to log in.</p>
                <a href="{% url 'profile' %}" class="btn btn-primary mt-3">Return to Profile</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
