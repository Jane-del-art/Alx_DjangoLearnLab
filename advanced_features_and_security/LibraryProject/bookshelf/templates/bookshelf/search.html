<!DOCTYPE html>
<html>
<head>
    <title>Search Books</title>
</head>
<body>
    <h1>Search Books</h1>
    
    <form method="get" action="{% url 'bookshelf:search' %}">
        <input type="text" name="q" value="{{ query }}" placeholder="Search books..." maxlength="100">
        <button type="submit">Search</button>
    </form>
    
    {% if query %}
        <h2>Results for "{{ query }}"</h2>
        
        {% if results %}
            <ul>
            {% for book in results %}
                <li>{{ book.title }} by {{ book.author }} ({{ book.publication_year }})</li>
            {% endfor %}
            </ul>
        {% else %}
            <p>No books found.</p>
        {% endif %}
    {% endif %}
    
    <a href="{% url 'bookshelf:book_list' %}">Back to all books</a>
</body>
</html>
